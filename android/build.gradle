// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
  configurations.all {
    resolutionStrategy {
      // react-native-track-player pulls KotlinAudio as a prebuilt AAR from JitPack.
      // Build it from android/kotlinaudio instead: ExoPlayer there seeks local MP3s
      // sample-exactly, so the transcript stays in sync after a seek (see its README).
      dependencySubstitution {
        substitute module('com.github.doublesymmetry:kotlinaudio') using project(':kotlinaudio')
      }
    }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
